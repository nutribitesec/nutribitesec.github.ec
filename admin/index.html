<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutribites · Panel del dueño</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  #app{display:grid;grid-template-columns:232px 1fr;height:100%}
  nav{background:var(--s1);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
  nav .logo{padding:0 10px 22px}
  nav a.t{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600;cursor:pointer}
  nav a.t:hover{background:var(--s2);color:var(--tx)}
  nav a.t.on{background:rgba(255,140,66,.13);color:var(--or)}
  nav .me{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;align-items:center}
  main{overflow:auto;padding:26px 30px 40px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  header.top h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  header.top p{color:var(--mu)}
  .tools{display:flex;gap:10px;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{padding:18px 20px}
  .kpi .v{font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .s{color:var(--mu);font-size:12px;margin-top:2px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
  .mapbox{height:520px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .pad{padding:18px 20px}
  .feed{max-height:430px;overflow:auto}
  .ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #1d1d1d}
  .ev:last-child{border:0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:10px}
  .legend span{display:inline-flex;gap:6px;align-items:center}
  .seller{display:flex;align-items:center;gap:12px}
  .rutas{display:grid;grid-template-columns:340px 1fr;gap:14px;height:calc(100vh - 150px);min-height:520px}
  .rutas .side{display:flex;flex-direction:column;overflow:hidden}
  .rutas .side .lst{overflow:auto;flex:1}
  .rutas .mapbox{height:100%}
  .li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #1d1d1d}
  .li .n{width:24px;height:24px;border-radius:50%;background:var(--or);color:#111;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
  .li small{color:var(--mu);display:block}
  .li .x{margin-left:auto;background:none;border:0;color:var(--mu);font-size:18px}
  @media(max-width:980px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav .logo,nav .me{display:none}.kpis{grid-template-columns:1fr 1fr}.grid2,.rutas{grid-template-columns:1fr;height:auto}main{padding:18px}.mapbox{height:380px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="../assets/vendor/leaflet/leaflet.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/login.js"></script>
<script src="admin.js"></script>
</body>
</html>
